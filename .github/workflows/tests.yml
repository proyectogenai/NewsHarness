name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencia opcional de OCR (validación de imágenes)
        run: python -m pip install --disable-pip-version-check "Pillow>=10"
      - name: Verificar checksums del paquete
        if: runner.os == 'Linux'
        run: sha256sum -c CHECKSUMS.sha256
      - name: Pruebas
        run: python -m unittest discover -s tests -v
